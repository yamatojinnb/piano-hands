# main に push されたら GitHub Pages に公開する
name: ページを公開（GitHub Pages・Netlify へ移るまでの暫定）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 公開する中身を確かめる
        run: |
          test -s index.html
          test -s songs/index.json
          for f in $(python3 -c "import json;print(' '.join(s['id'] for s in json.load(open('songs/index.json'))))"); do test -s "songs/$f.json"; done
          test "$(ls assets/piano/*.mp3 | wc -l)" -ge 20

      - name: 公開用フォルダを作る
        run: |
          mkdir _site
          cp -r index.html songs assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
