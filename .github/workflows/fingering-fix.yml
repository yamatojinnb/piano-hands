# 画面の「GitHubに保存」で作られた [運指] Issue を、指番号の修正としてリポジトリに取り込む
name: 指番号の修正を取り込む

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: fingering-fix
  cancel-in-progress: false

jobs:
  apply:
    # リポジトリの持ち主が作った [運指] Issue だけを処理する
    if: startsWith(github.event.issue.title, '[運指]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: 依存ライブラリを入れる
        run: pip install -r tools/requirements.txt

      - name: 修正を fix ファイルに書き込む
        id: fix
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: echo "song=$(python tools/apply_fix.py)" >> "$GITHUB_OUTPUT"

      - name: 修正した指を前提に手の動きを計算し直す
        run: python tools/build_song.py "${{ steps.fix.outputs.song }}"

      - name: 曲データができたか確かめる
        run: test -s "songs/${{ steps.fix.outputs.song }}.json"

      - name: コミットして公開し直す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs tools/report.json
          git commit -m "指番号の修正を取り込み: ${{ steps.fix.outputs.song }} (#${{ github.event.issue.number }})" || echo "変更なし"
          git push
          gh workflow run pages.yml --ref main

      - name: Issue に結果を書いて閉じる
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh issue close ${{ github.event.issue.number }} --comment "取り込みました。数分後にページを開き直すと反映されています。"
          else
            gh issue comment ${{ github.event.issue.number }} --body "取り込みに失敗しました。Actions のログを確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
